name: Release

# Publishes a prebuilt binary tarball on the GitHub Release for a version tag
# so `mise` (via the `ubi` backend) can install and upgrade Venturi.
#
# Runs automatically when a `MAJOR.MINOR.PATCH` tag is pushed. Use the manual
# dispatch to (re)build assets for a tag that already exists.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. 0.4.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpipewire-0.3-dev \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Check tag matches Cargo.toml version
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "venturi") | .version')
          if [ "$crate_version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/venturi dist/
          cp data/venturi.desktop dist/
          cp data/org.venturi.Venturi.metainfo.xml dist/
          cp data/org.venturi.Venturi.svg dist/
          tar -czf venturi-${{ matrix.target }}.tar.gz -C dist .
          sha256sum venturi-${{ matrix.target }}.tar.gz > venturi-${{ matrix.target }}.tar.gz.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Notes are written by hand; only create a bare release if none exists.
          generate_release_notes: false
          files: |
            venturi-${{ matrix.target }}.tar.gz
            venturi-${{ matrix.target }}.tar.gz.sha256
